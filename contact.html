<!DOCTYPE html>

                    />

            <!-- ================= NAVIGATION ================= -->

            <!-- ================= THEME BUTTON ================= -->

        <!-- ============ CONTACT ============== -->

            <!-- ================= CONTACT CONTENT ================= -->

                        width="30"

                <!-- DESCRIPTION -->

                        <div class="contact-text">

                            <p class="contact-label">

                            </p>

                            <p
                                class="contact-value"
                                dir="ltr"
                            >
                                0912 345 6789
                            </p>

                        </div>


                    </div>



                    <!-- INSTAGRAM -->

                    <div class="contact-row">


                        <div class="contact-icon">

                            <svg
                                viewBox="0 0 24 24"
                                width="18"
                                height="18"
                                fill="none"
                                stroke="#2f6b63"
                                stroke-width="1.8"
                            >

                                <rect
                                    x="3.5"
                                    y="3.5"
                                    width="17"
                                    height="17"
                                    rx="5"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="4"
                                />

                                <circle
                                    cx="17"
                                    cy="7"
                                    r="1"
                                    fill="#2f6b63"
                                    stroke="none"
                                />

                            </svg>

                        </div>


                        <div class="contact-text">

                            <p class="contact-label">
                                اینستاگرام
                            </p>

                            <p
                                class="contact-value"
                                dir="ltr"
                            >
                                @blueaura.cafe
                            </p>

                        </div>


                    </div>



                    <!-- EMAIL -->

                    <div class="contact-row">


                        <div class="contact-icon">

                            <svg
                                viewBox="0 0 24 24"
                                width="18"
                                height="18"
                                fill="none"
                                stroke="#2f6b63"
                                stroke-width="1.8"
                            >

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2.5"
                                />

                                <path
                                    d="M3.5 6.5 12 13l8.5-6.5"
                                />

                            </svg>

                        </div>


                        <div class="contact-text">

                            <p class="contact-label">
                                ایمیل
                            </p>

                            <p
                                class="contact-value"
                                dir="ltr"
                            >
                                info@blueaura.cafe
                            </p>

                        </div>


                    </div>



                    <!-- ADDRESS -->

                    <div class="contact-row">


                        <div class="contact-icon">

                            <svg
                                viewBox="0 0 24 24"
                                width="18"
                                height="18"
                                fill="none"
                                stroke="#2f6b63"
                                stroke-width="1.8"
                            >

                                />

                                <circle
                                    cx="12"
                                    cy="9.5"
                                    r="2.3"
                                />

                        </div>


                        <div class="contact-text">

                            <p class="contact-label">
                                آدرس

                            </p>

                        </div>


                    </div>


                </div>


            </div>


        </section>


    </div>



    <!-- ============= JAVASCRIPT — DARK MODE ============ -->

    <script>


        /* ==================== ELEMENTS =============== */

        const page =
            document.querySelector('.page');


        const themeButton =
            document.getElementById('themeButton');


        const themeIcon =
            document.getElementById('themeIcon');


        const heroImage =
            document.getElementById('heroImage');


        const heroTitleImg =
            document.getElementById('heroTitleImg');



        /* ============ LOAD SAVED THEME ================= */

        const savedTheme =
            localStorage.getItem('theme');


        if (savedTheme === 'dark') {

            page.classList.add('dark-mode');

            themeIcon.textContent = '☾';

            heroImage.src =
                'images/night-hero.png';

            heroTitleImg.style.display = 'none';

        }



        /* ==================== CHANGE THEME ================= */

        themeButton.addEventListener('click', function () {


            page.classList.toggle('dark-mode');


            const isDark =
                page.classList.contains('dark-mode');



            /* ================= NIGHT ================= */

            if (isDark) {

                themeIcon.textContent = '☾';

                heroImage.src =
                    'images/night-hero.png';

                heroTitleImg.style.display = 'none';


                localStorage.setItem(
                    'theme',
                    'dark'
                );

            }



            /* ================= DAY ================= */

            else {

                themeIcon.textContent = '☼';

                heroImage.src =
                    'images/hero-final.png';

                heroTitleImg.style.display = 'block';


                localStorage.setItem(
                    'theme',
                    'light'
                );

            }


        });


    </script>


</body>

</html>
